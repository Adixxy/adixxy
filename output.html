<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay Iglesia - OBS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="output-only">
    <div id="overlay" class="overlay-canvas output-mode">
      <img id="logo" class="overlay-logo hidden" alt="Logo" />
      <div id="dateBadge" class="overlay-date hidden"></div>
      <div id="nameTag" class="overlay-name hidden"></div>
      <div id="announcementBar" class="overlay-announcement hidden"></div>
      <div id="alertBox" class="overlay-alert hidden"></div>
      <button id="secretPanelBtn" class="secret-btn hidden" title="Volver al panel">◉</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
